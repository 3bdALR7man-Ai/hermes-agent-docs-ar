name: فحص تحديثات الوثائق الأصلية

on:
  schedule:
    - cron: '0 6 * * 1'   # كل اثنين 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: فحص فقط (لا يعدّل شيئًا)
        working-directory: tools
        run: node update.js | tee ../report.txt
      - name: فتح Issue عند وجود تغييرات
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -qE '(جديدة|متغيّرة|محذوفة من الأصل): [1-9]' report.txt; then
            title="تحديثات في الوثائق الأصلية — $(date -u +%F)"
            existing=$(gh issue list --label upstream-update --state open --json number -q '.[0].number')
            if [ -z "$existing" ]; then
              gh issue create --title "$title" --label upstream-update --body-file report.txt
            else
              gh issue comment "$existing" --body-file report.txt
            fi
          else
            echo "لا تغييرات."
          fi
